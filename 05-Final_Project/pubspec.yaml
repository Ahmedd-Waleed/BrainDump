name: braindump
description: BrainDump AI - Capture your thoughts instantly. AI organizes them.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────
  provider: ^6.1.1

  # ── Backend (Firebase) ────────────────
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19

  # ── Local Storage ─────────────────────
  shared_preferences: ^2.2.2

  # ── Notifications ─────────────────────
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # ── Voice ─────────────────────────────
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.0

  # ── HTTP for Gemini API ───────────────
  http: ^1.2.0

  # ── Utilities ─────────────────────────
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700